[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t2f-trainer"
version = "0.1.0"
description = "RL trainer for verifiers environments, forked from verifiers-rl"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "verifiers",
    "torch>=2.8.0,<2.9.0",
    "transformers>=4.56.2",
    "accelerate>=1.4.0",
    "requests",
    "peft",
    "wandb",
    "vllm>=0.10.0,<0.11.0",
    "liger-kernel>=0.5.10",
    "deepspeed>=0.17.6",
    "flash-attn>=2.8.3",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[project.scripts]
t2f-rl = "t2f_trainer.scripts.rl:main"
t2f-train = "t2f_trainer.scripts.train:main"
t2f-vllm = "t2f_trainer.rl.inference.server:main"

[tool.hatch.build.targets.wheel]
packages = ["t2f_trainer"]
