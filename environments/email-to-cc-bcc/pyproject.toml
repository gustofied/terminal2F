[project]
name = "email-to-cc-bcc"
description = "Correctly assign email recipients to To, CC, and BCC fields based on roles and privacy constraints"
tags = ["structured-output", "rules", "email", "train", "eval", "reasoning"]
version = "0.1.6"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["email_to_cc_bcc.py", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 3
max_tokens = 1024
