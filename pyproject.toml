[project]
name = "terminal2f"
version = "0.1.2"
description = "terminal2F, gustofied reborn"
readme = "README.md"
authors = [
    { name = "gustofied", email = "gustofied@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alphabet-sort",
    "asyncpg>=0.31.0",
    "data-designer>=0.2.1",
    "email-to-cc-bcc",
    "fastmcp>=3.0.2",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "mistral-common>=1.8.8",
    "mistralai>=1.10.0",
    "pandas>=2.3.3",
    "prime>=0.5.37",
    "psycopg>=3.3.3",
    "psycopg-binary>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=22.0.0",
    "pylance>=1.0.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rerun-sdk[datafusion]>=0.28.1",
    "tqdm>=4.67.1",
    "transformers>=5.2.0",
    "typer>=0.21.1",
    "ulid-py>=1.1.0",
    "verifiers>=0.1.10",
    "wandb>=0.25.0",
    "weasyprint>=68.0",
]

[project.scripts]
t2f = "terminal2f.main:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "environments/alphabet-sort",
    "environments/email-to-cc-bcc",
]

[tool.uv.sources]
alphabet-sort = { workspace = true, editable = true }
email-to-cc-bcc = { workspace = true, editable = true }
